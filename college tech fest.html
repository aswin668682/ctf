
<!DOCTYPE html>
<html>
<head>
    <title>College Event Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        .banner {
            background: #1769aa;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .schedule {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 25px;
        }

        .event {
            background: white;
            padding: 20px;
            width: 220px;
            text-align: center;
            border-radius: 8px;
        }

        .register {
            display: block;
            width: 120px;
            margin: 10px auto 30px;
            padding: 12px;
            background: #1769aa;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
        }

        @media (max-width: 600px) {
            .banner {
                padding: 20px 10px;
            }

            .banner h1 {
                font-size: 25px;
            }

            .schedule {
                flex-direction: column;
                align-items: center;
            }

            .event {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <div class="banner">
        <h1>College Tech Fest 2026</h1>
        <p>Learn, Create and Innovate!</p>
        <p>October 30 | College Auditorium</p>
    </div>

    <div class="schedule">
        <div class="event">
            <h3>09:00 AM</h3>
            <h2>Inauguration</h2>
            <p>Opening ceremony</p>
        </div>

        <div class="event">
            <h3>11:00 AM</h3>
            <h2>Code Challenge</h2>
            <p>Show your coding skills</p>
        </div>

        <div class="event">
            <h3>02:00 PM</h3>
            <h2>Project Expo</h2>
            <p>Display your projects</p>
        </div>
    </div>

    <a href="mailto:events@college.edu"
       class="register">Register Now</a>

</body>
</html>
